name: The Vivle

options:
  bundleIdPrefix: com.lowen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  The Vivle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Service
      - path: ViewModels
      - path: Views
      - path: TheVivleApp.swift
    resources:
      - path: Assets.xcassets
      - path: Resources/Verses.json
      - path: LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowen.thevivle
        PRODUCT_NAME: TheVivle
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: The Vivle.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  The Vivle:
    build:
      targets:
        The Vivle: all
    run:
      config: Debug
    archive:
      config: Release
